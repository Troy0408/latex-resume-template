name: Build and check the example
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-24.04
    # TeX Live 2025 historic release
    container: texlive/texlive@sha256:dbd65d778eb83de9b45fb0a8deb3afe44cbbaba2272e4e1e644e94dda52c7109
    steps:
      - uses: actions/checkout@v4
      - name: Compile the default example
        run: |
          fmtutil-sys --byfmt xelatex
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error -outdir=build -jobname=resume resume-zh_CN.tex
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error -outdir=build -jobname=preview examples/preview.tex
      - name: Smoke-test photo, GitHub, and website header fields
        run: |
          mkdir -p build
          cat <<'EOF' > build/smoke_photo.tex
          \documentclass{resume}
          \newcommand{\resumename}{林知远}
          \newcommand{\resumeaddress}{广州}
          \newcommand{\resumephone}{1XX-XXXX-XXXX}
          \newcommand{\resumeemail}{lin.zhiyuan@example.com}
          \newcommand{\githubuser}{Troy0408}
          \newcommand{\resumewebsite}{https://example.com}
          \newcommand{\resumewebsitetext}{   }
          \geometry{a4paper,left=0.80in,right=0.80in,top=0.62in,bottom=0.55in,nohead}
          \definecolor{fgcolor}{HTML}{2B579A}
          \definecolor{secondary}{HTML}{595959}
          \showphototrue
          \newcommand{\photopath}{images/photo}
          \setlength{\photowidth}{2.25cm}
          \setlength{\photoheight}{3cm}
          \begin{document}
          \input{texs/header_with_photo}
          \input{texs/sections}
          \end{document}
          EOF
          cat <<'EOF' > build/smoke_custom.tex
          \documentclass{resume}
          \newcommand{\resumename}{林知远}
          \newcommand{\resumeaddress}{广州}
          \newcommand{\resumephone}{   }
          \newcommand{\resumeemail}{lin.zhiyuan@example.com}
          \newcommand{\githubuser}{Troy\_0408}
          \newcommand{\resumewebsite}{https://example.com}
          \newcommand{\resumewebsitetext}{个人主页}
          \geometry{a4paper,left=0.80in,right=0.80in,top=0.62in,bottom=0.55in,nohead}
          \definecolor{fgcolor}{HTML}{2B579A}
          \definecolor{secondary}{HTML}{595959}
          \showphotofalse
          \begin{document}
          \input{texs/header_with_photo}
          \input{texs/sections}
          \end{document}
          EOF
          cp images/photo-placeholder.png images/photo.png
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error -outdir=build -jobname=smoke_photo build/smoke_photo.tex
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error -outdir=build -jobname=smoke_custom build/smoke_custom.tex
          rm -f images/photo.png
      - name: Install PDF inspection tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends poppler-utils poppler-data
      - name: Check the example page count and text
        run: |
          export LC_ALL=C
          pdfinfo build/resume.pdf | grep -Eq '^Pages:[[:space:]]+1$'
          pdfinfo build/preview.pdf | grep -Eq '^Pages:[[:space:]]+1$'
          pdfinfo build/smoke_photo.pdf | grep -Eq '^Pages:[[:space:]]+1$'
          pdfinfo build/smoke_custom.pdf | grep -Eq '^Pages:[[:space:]]+1$'
          pdftotext -layout -enc UTF-8 build/resume.pdf build/example.txt
          pdftotext -layout -enc UTF-8 build/preview.pdf build/preview.txt
          for kw in '广东工业大学' '集成电路学院' '教育背景' '实习经历' '同步 FIFO' '荣誉奖项' '全国大学生集成电路创新创业大赛' 'lin.zhiyuan@example.com'; do
            grep -Fq "$kw" build/example.txt
          done
          ! grep -Fq '求职意向' build/example.txt
          ! grep -Fq '求职意向' build/preview.txt
          for job in resume preview smoke_photo smoke_custom; do
            ! grep -Eq 'Overfull \\hbox|Missing character' "build/$job.log"
            pdfimages -list "build/$job.pdf" > "build/$job-images.txt"
            count=$(awk '$3 == "image" { n++ } END { print n+0 }' "build/$job-images.txt")
            if [ "$job" = smoke_photo ] || [ "$job" = preview ]; then test "$count" -eq 1; else test "$count" -eq 0; fi
          done
          pdftotext -layout -enc UTF-8 build/smoke_photo.pdf build/smoke_photo.txt
          grep -Fq 'github.com/Troy0408' build/smoke_photo.txt
          grep -Fq 'https://example.com' build/smoke_photo.txt
          pdftotext -layout -enc UTF-8 build/smoke_custom.pdf build/smoke_custom.txt
          grep -Fq 'github.com/Troy_0408' build/smoke_custom.txt
          grep -Fq '个人主页' build/smoke_custom.txt
      - uses: actions/upload-artifact@v4
        with:
          name: resume-example
          path: build/resume.pdf
